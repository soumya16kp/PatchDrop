name: Deploy

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:          # manual trigger from GitHub UI
  push:
    branches: [main]          # deploy on any code change to main
    paths-ignore:
      - '**.md'               # skip docs-only changes
      - '.github/workflows/pr-check.yml'

permissions:
  contents: write             # needed to commit cache + push to Pages

jobs:
  # ── Unit + integration tests ─────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test

  # ── Main build + deploy ───────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test                 # ← blocks deploy if tests fail
    # Serialize builds so concurrent triggers never conflict on the data commit.
    # cancel-in-progress: false → new runs queue rather than cancel the active one.
    concurrency:
      group: build-and-deploy
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Cache Ollama model ────────────────────────────────────────────────
      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-llama3.1-8b
          restore-keys: |
            ollama-llama3.1-8b

      # ── Install & start Ollama ───────────────────────────────────────────
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama service
        run: |
          # The install script may have already started Ollama as a systemd
          # service.  Kill any running instance first to avoid the
          # "address already in use" port conflict on 127.0.0.1:11434.
          sudo pkill -f "ollama" || true
          sleep 1
          ollama serve &>/dev/null &

      - name: Wait for Ollama to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:11434/api/tags && break
            echo "Waiting for Ollama... ($i)"
            sleep 2
          done

      - name: Pull model
        run: ollama pull ${{ vars.OLLAMA_MODEL || 'llama3.2:1b' }}

      # ── Build feed with LLM classification ──────────────────────────────
      - name: Build feed data
        # continue-on-error: a failing feed build (e.g. Ollama not ready,
        # network hiccup) must NOT block the video feed or deploy steps.
        continue-on-error: true
        env:
          USE_LLM: '1'
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:1b' }}
        run: node scripts/generate-version.mjs && node scripts/build-feed.mjs

      # ── Build video feed (YouTube Atom RSS) ──────────────────────────────
      - name: Build video feed
        # if: always() ensures this step runs even when "Build feed data" fails.
        if: always()
        run: node scripts/build-videos.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Generate sitemap & SEO content
        if: always()
        run: node scripts/generate-sitemap.mjs && node scripts/generate-seo-content.mjs

      # ── Cache AI classification cache ────────────────────────────────────
      - name: Cache AI classification cache
        uses: actions/cache@v4
        with:
          path: .ai-category-cache.json
          key: ai-category-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ai-category-cache-

      # ── Build & deploy to GitHub Pages ──────────────────────────────
      - name: Build Vite app
        if: always()
        run: npm run build:app

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: GameBeeper.gg


